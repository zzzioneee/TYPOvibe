<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>구멍 — 11월 데일리 바이브</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root {
    --page: #e4e7f3;
    --window: #f7f4ee;
    --ink: #2f2b27;
    --muted: #9a9186;
    --soft: #6f675e;
    --line: #e6dfd4;
    --track: #e4ddd4;
    --fill: #8f877c;
    --stage: #f3efe8;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--page);
    color: var(--ink);
    font-family: "Pretendard", sans-serif;
  }
  button, input { font-family: inherit; }
  .app {
    height: calc(100% - 28px);
    margin: 14px;
    background: var(--window);
    border-radius: 16px;
    box-shadow: 0 12px 40px rgba(48, 46, 72, 0.08);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border: 1px solid rgba(255, 255, 255, 0.8);
  }
  .top {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 52px;
    padding: 0 16px 0 18px;
    flex-shrink: 0;
  }
  .brand {
    width: 16px;
    height: 16px;
    border: 1.5px solid #b7aea2;
    border-radius: 50%;
  }
  .top h1 {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    margin: 0;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: -0.01em;
    color: #5e574f;
    white-space: nowrap;
    pointer-events: none;
  }
  .top-actions { display: flex; gap: 6px; }
  .text-btn {
    border: 0;
    background: transparent;
    color: var(--soft);
    font-size: 13px;
    padding: 6px 8px;
    border-radius: 8px;
    cursor: pointer;
  }
  .text-btn:hover { background: rgba(80, 60, 40, 0.05); }
  .text-btn.on { color: var(--ink); font-weight: 600; }
  .text-btn:disabled { opacity: 0.45; cursor: default; }
  .body { flex: 1; min-height: 0; display: flex; }
  aside {
    width: 272px;
    flex-shrink: 0;
    padding: 8px 22px 22px;
    overflow: auto;
    border-right: 1px solid rgba(60, 40, 20, 0.04);
  }
  .piece {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.03em;
    margin: 8px 0 4px;
  }
  .lede {
    margin: 0 0 18px;
    font-size: 12px;
    line-height: 1.45;
    color: var(--muted);
  }
  .group { margin-bottom: 16px; }
  .group-label {
    font-size: 12px;
    color: var(--soft);
    margin-bottom: 8px;
  }
  .slider { display: block; margin: 0 0 12px; }
  .slider-top {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    margin-bottom: 2px;
  }
  .slider-top b { font-weight: 500; color: #8a837a; }
  .slider input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 16px;
    margin: 0;
    background: transparent;
    cursor: pointer;
  }
  .slider input[type="range"]::-webkit-slider-runnable-track {
    height: 2px;
    border-radius: 2px;
    background: linear-gradient(90deg, var(--fill) var(--p, 50%), var(--track) var(--p, 50%));
  }
  .slider input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    margin-top: -6px;
    border-radius: 50%;
    background: #fff;
    border: 1px solid #cfc6ba;
    box-shadow: 0 1px 2px rgba(40, 30, 20, 0.16);
  }
  .slider input[type="range"]::-moz-range-track {
    height: 2px;
    border: 0;
    border-radius: 2px;
    background: linear-gradient(90deg, var(--fill) var(--p, 50%), var(--track) var(--p, 50%));
  }
  .slider input[type="range"]::-moz-range-thumb {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #fff;
    border: 1px solid #cfc6ba;
  }
  .seg {
    display: flex;
    background: #ece6dc;
    border-radius: 999px;
    padding: 3px;
    margin: 4px 0 14px;
  }
  .seg button {
    flex: 1;
    border: 0;
    background: transparent;
    border-radius: 999px;
    padding: 6px 0;
    font-size: 12px;
    color: #7d756c;
    cursor: pointer;
  }
  .seg button.on {
    background: #fff;
    color: var(--ink);
    box-shadow: 0 1px 2px rgba(40, 30, 20, 0.08);
  }
  .check {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    margin: 0 0 8px;
    cursor: pointer;
  }
  .check input {
    appearance: none;
    width: 14px;
    height: 14px;
    margin: 0;
    border: 1.5px solid #b7aea3;
    border-radius: 2px;
    background: #fff;
    display: grid;
    place-items: center;
  }
  .check input:checked { background: var(--soft); border-color: var(--soft); }
  .check input:checked::after {
    content: "";
    width: 7px;
    height: 4px;
    border-left: 1.5px solid #fff;
    border-bottom: 1.5px solid #fff;
    transform: translateY(-1px) rotate(-45deg);
  }
  .note {
    margin: 8px 0 0;
    font-size: 11px;
    line-height: 1.5;
    color: #b0a89e;
  }
  .file {
    display: inline-block;
    margin-top: 4px;
    font-size: 12px;
    color: var(--soft);
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  .file input { display: none; }
  .main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    padding: 6px 16px 14px;
  }
  .stage {
    position: relative;
    flex: 1;
    min-height: 0;
    border-radius: 12px;
    overflow: hidden;
    background: var(--stage);
  }
  canvas { width: 100%; height: 100%; display: block; }
  .poster {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    background:
      radial-gradient(circle at 50% 42%, rgba(255,255,255,0.7), transparent 46%),
      var(--stage);
  }
  .stage.live .poster { display: none; }
  .hole-still {
    width: min(34vh, 240px);
    aspect-ratio: 1;
    border-radius: 50%;
    overflow: hidden;
    background: #efe8de;
    box-shadow:
      inset 0 0 0 1px rgba(255, 250, 244, 0.7),
      inset 0 0 24px rgba(40, 24, 12, 0.16),
      0 16px 40px rgba(70, 50, 30, 0.12);
    animation: bob 4.8s ease-in-out infinite;
  }
  .hole-still img { width: 100%; height: 100%; object-fit: cover; object-position: center 42%; }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
  .poster p {
    margin: 0;
    text-align: center;
    font-size: 13px;
    line-height: 1.55;
    color: var(--soft);
  }
  .poster .go {
    border: 0;
    background: #2f2b27;
    color: #fff;
    border-radius: 999px;
    padding: 10px 18px;
    font-size: 13px;
    cursor: pointer;
  }
  .diagram {
    position: absolute;
    right: 12px;
    bottom: 12px;
    width: 168px;
    padding: 8px 8px 6px;
    border-radius: 10px;
    background: rgba(255, 252, 248, 0.92);
    box-shadow: 0 6px 18px rgba(40, 30, 20, 0.08);
    display: none;
  }
  .stage.live .diagram { display: block; }
  .diagram svg { width: 100%; height: auto; display: block; }
  .diagram span {
    display: block;
    text-align: center;
    font-size: 10px;
    color: #8a8175;
    margin-top: 2px;
  }
  .meta { padding: 12px 4px 0; }
  .meta-row { display: flex; align-items: center; gap: 12px; }
  .chip {
    font-size: 12px;
    padding: 4px 8px;
    border-radius: 999px;
    background: #fff;
    border: 1px solid var(--line);
    color: var(--soft);
  }
  #status { font-size: 13px; font-weight: 600; }
  .help, .nums {
    margin: 6px 0 0;
    font-size: 12px;
    line-height: 1.5;
    color: #a39b91;
  }
  .nums { margin-top: 2px; }
  video {
    position: fixed;
    left: -2000px;
    width: 320px;
    height: 240px;
  }
  @media (max-width: 860px) {
    .body { flex-direction: column; }
    aside {
      width: auto;
      max-height: 38vh;
      border-right: 0;
      border-bottom: 1px solid var(--line);
    }
    .top h1 { display: none; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand" aria-hidden="true"></div>
    <h1>구멍 — 11월 데일리 바이브</h1>
    <div class="top-actions">
      <button id="sim" class="text-btn" type="button">미리보기</button>
      <button id="cam" class="text-btn" type="button">카메라 켜기</button>
    </div>
  </header>
  <div class="body">
    <aside>
      <div class="piece">동그라미</div>
      <p class="lede">두 손이 만든 원 사이로 고양이가 나옵니다.</p>

      <div class="group">
        <div class="group-label">구멍</div>
        <label class="slider"><span class="slider-top"><span>민감도</span><b data-for="sensitivity">62%</b></span>
          <input type="range" min="0" max="100" value="62" data-key="sensitivity"></label>
      </div>

      <div class="group">
        <div class="group-label">고양이</div>
        <label class="slider"><span class="slider-top"><span>크기</span><b data-for="size">120%</b></span>
          <input type="range" min="40" max="180" value="120" data-key="size"></label>
        <label class="slider"><span class="slider-top"><span>튀어나옴</span><b data-for="emerge">68%</b></span>
          <input type="range" min="0" max="100" value="68" data-key="emerge"></label>
        <label class="slider"><span class="slider-top"><span>탄력</span><b data-for="bounce">58%</b></span>
          <input type="range" min="0" max="100" value="58" data-key="bounce"></label>
        <label class="slider"><span class="slider-top"><span>가장자리</span><b data-for="feather">24%</b></span>
          <input type="range" min="0" max="100" value="24" data-key="feather"></label>
        <label class="slider"><span class="slider-top"><span>얼굴 위치</span><b data-for="face">42%</b></span>
          <input type="range" min="0" max="100" value="42" data-key="face"></label>
        <div class="seg" id="cat-seg">
          <button type="button" data-cat="open" class="on">눈 뜨기</button>
          <button type="button" data-cat="shut">눈 감기</button>
        </div>
        <label class="check"><input type="checkbox" data-key="tilt" checked>기울기 따라가기</label>
        <label class="file">사진 바꾸기<input id="file" type="file" accept="image/*"></label>
        <p class="note">레퍼런스 01 · 우리집 고양이<br>엄지는 아래, 검지는 위에서 만나게 모아 주세요.</p>
      </div>

      <div class="group">
        <div class="group-label">화면</div>
        <label class="check"><input type="checkbox" data-key="guide" checked>원 가이드</label>
        <label class="check"><input type="checkbox" data-key="skeleton">손 라인</label>
        <label class="check"><input type="checkbox" data-key="mirror" checked>거울</label>
      </div>
    </aside>

    <section class="main">
      <div class="stage" id="stage">
        <canvas id="view"></canvas>
        <div class="poster" id="poster">
          <div class="hole-still"><img src="./cat-open.png" alt="우리집 고양이"></div>
          <p>두 손으로 동그라미를 만들면<br>그 사이로 이 얼굴이 나옵니다</p>
          <button class="go" id="go" type="button">카메라 켜기</button>
        </div>
        <div class="diagram">
          <svg viewBox="0 0 160 86" fill="none" aria-hidden="true">
            <circle cx="80" cy="40" r="22" stroke="#8d8478" stroke-width="1.4"/>
            <circle cx="80" cy="40" r="8" fill="#e7e0d6"/>
            <path d="M34 58c10-26 22-30 30-8" stroke="#8d8478" stroke-width="1.4" stroke-linecap="round"/>
            <path d="M126 58c-10-26-22-30-30-8" stroke="#8d8478" stroke-width="1.4" stroke-linecap="round"/>
            <path d="M46 62c8 10 18 12 34 4" stroke="#c3baae" stroke-width="1.2" stroke-linecap="round"/>
            <path d="M114 62c-8 10-18 12-34 4" stroke="#c3baae" stroke-width="1.2" stroke-linecap="round"/>
          </svg>
          <span>엄지 아래 · 검지 위</span>
        </div>
      </div>
      <div class="meta">
        <div class="meta-row">
          <span class="chip" id="chip">대기</span>
          <span id="status">카메라를 켜면 손이 구멍을 만듭니다</span>
        </div>
        <p class="help">양손 엄지를 아래에서, 검지를 위에서 붙여 동그라미를 만드세요. 가운데가 비면 고양이가 그 구멍으로 나옵니다.</p>
        <p class="nums" id="nums">원형도 — · 틈 —</p>
      </div>
    </section>
  </div>
</div>
<video id="video" playsinline autoplay muted></video>
<script type="module">
import {
  coverRect, detectHole, mapLandmark, springGains, stepSpring, syntheticHoleHands,
} from './hole.js'

const REASON = {
  wait: '양손을 카메라에 보여주세요',
  hands: '손목은 아래로 두고 손가락으로 원을 만들어 주세요',
  size: '동그라미 크기를 조금 조절해 주세요',
  blocked: '구멍 가운데를 비워 주세요',
  shape: '조금 더 둥글게 모아 주세요',
  gap: '엄지와 검지를 더 가까이 붙여 주세요',
  open: '구멍 열림',
}
const BONES = [
  [0, 1], [1, 2], [2, 3], [3, 4],
  [0, 5], [5, 6], [6, 7], [7, 8],
  [5, 9], [9, 10], [10, 11], [11, 12],
  [9, 13], [13, 14], [14, 15], [15, 16],
  [13, 17], [17, 18], [18, 19], [19, 20],
  [0, 17],
]
const WASM = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.34/wasm'
const MODEL = 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task'
const STORE = 'nov01-hole-settings'

const stage = document.getElementById('stage')
const canvas = document.getElementById('view')
const ctx = canvas.getContext('2d')
const video = document.getElementById('video')
const statusEl = document.getElementById('status')
const numsEl = document.getElementById('nums')
const chipEl = document.getElementById('chip')
const camBtn = document.getElementById('cam')
const simBtn = document.getElementById('sim')
const scratch = document.createElement('canvas')
const sctx = scratch.getContext('2d')

const settings = {
  sensitivity: 62,
  size: 120,
  emerge: 68,
  bounce: 58,
  feather: 24,
  face: 42,
  cat: 'open',
  tilt: true,
  guide: true,
  skeleton: false,
  mirror: true,
}
const images = { open: loadImage('./cat-open.png'), shut: loadImage('./cat-shut.png') }
const spring = { x: 0, v: 0 }
const smooth = { x: 0, y: 0, r: 0, a: 0 }
let haveHole = false
let miss = 0
let cameraOn = false
let simOn = false
let looping = false
let lastNow = 0
let landmarker = null
let usingGpu = true
let switching = false
let lastTs = -1
let stream = null
let handsPx = []
let simStarted = 0

const params = new URLSearchParams(location.search)
restore()
bindControls()
if (params.get('sim') === '1') startSim()

function loadImage(src) {
  const img = new Image()
  img.src = src
  return img
}

function restore() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORE) || 'null')
    if (!saved) return
    for (const key of Object.keys(settings)) {
      if (key in saved) settings[key] = saved[key]
    }
  } catch { /* 저장된 값이 깨져 있으면 기본값을 쓴다 */ }
}

function persist() {
  localStorage.setItem(STORE, JSON.stringify(settings))
}

function bindControls() {
  for (const input of document.querySelectorAll('[data-key]')) {
    const key = input.dataset.key
    if (input.type === 'checkbox') input.checked = Boolean(settings[key])
    else input.value = settings[key]
    paintRange(input)
    input.addEventListener('input', () => {
      settings[key] = input.type === 'checkbox' ? input.checked : Number(input.value)
      paintRange(input)
      persist()
    })
  }
  for (const btn of document.querySelectorAll('#cat-seg button')) {
    btn.classList.toggle('on', btn.dataset.cat === settings.cat)
    btn.addEventListener('click', () => {
      settings.cat = btn.dataset.cat
      for (const other of document.querySelectorAll('#cat-seg button')) {
        other.classList.toggle('on', other === btn)
      }
      persist()
    })
  }
  camBtn.addEventListener('click', () => (cameraOn ? stopCamera() : startCamera()))
  document.getElementById('go').addEventListener('click', startCamera)
  simBtn.addEventListener('click', () => (simOn ? stopSim() : startSim()))
  document.getElementById('file').addEventListener('change', (event) => {
    const file = event.target.files && event.target.files[0]
    if (!file) return
    const img = new Image()
    img.onload = () => { images[settings.cat] = img }
    img.src = URL.createObjectURL(file)
  })
}

function paintRange(input) {
  if (input.type !== 'range') return
  const p = ((input.value - input.min) / (input.max - input.min)) * 100
  input.style.setProperty('--p', `${p}%`)
  const label = document.querySelector(`[data-for="${input.dataset.key}"]`)
  if (label) label.textContent = `${input.value}%`
}

async function startCamera() {
  stopSim()
  camBtn.disabled = true
  camBtn.textContent = '불러오는 중'
  statusEl.textContent = '손 모델을 불러오는 중'
  try {
    if (!landmarker) {
      try { await createLandmarker('GPU') }
      catch { await createLandmarker('CPU') }
    }
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false,
    })
    video.srcObject = stream
    await video.play()
    cameraOn = true
    stage.classList.add('live')
    camBtn.textContent = '카메라 중지'
    chipEl.textContent = '실시간 화면'
    ensureLoop()
  } catch (error) {
    cameraOn = false
    stage.classList.remove('live')
    camBtn.textContent = '카메라 켜기'
    statusEl.textContent = cameraMessage(error)
  } finally {
    camBtn.disabled = false
  }
}

function cameraMessage(error) {
  if (error && error.name === 'NotAllowedError') return '카메라 권한이 필요해요'
  if (error && error.name === 'NotFoundError') return '카메라를 찾지 못했어요'
  return '카메라를 켜지 못했어요'
}

async function createLandmarker(delegate) {
  const vision = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.34/vision_bundle.mjs')
  const files = await vision.FilesetResolver.forVisionTasks(WASM)
  if (landmarker) landmarker.close?.()
  landmarker = await vision.HandLandmarker.createFromOptions(files, {
    baseOptions: { modelAssetPath: MODEL, delegate },
    runningMode: 'VIDEO',
    numHands: 2,
  })
  usingGpu = delegate === 'GPU'
  lastTs = -1
}

function stopCamera() {
  cameraOn = false
  if (!simOn) stage.classList.remove('live')
  camBtn.textContent = '카메라 켜기'
  chipEl.textContent = '대기'
  statusEl.textContent = '카메라를 켜면 손이 구멍을 만듭니다'
  if (stream) {
    for (const track of stream.getTracks()) track.stop()
    stream = null
  }
  video.srcObject = null
}

function startSim() {
  if (cameraOn) stopCamera()
  simOn = true
  simStarted = performance.now()
  stage.classList.add('live')
  simBtn.classList.add('on')
  simBtn.textContent = '미리보기 끄기'
  chipEl.textContent = '미리보기'
  ensureLoop()
}

function stopSim() {
  simOn = false
  simBtn.classList.remove('on')
  simBtn.textContent = '미리보기'
  if (!cameraOn) {
    stage.classList.remove('live')
    chipEl.textContent = '대기'
    statusEl.textContent = '카메라를 켜면 손이 구멍을 만듭니다'
  }
}

function ensureLoop() {
  if (looping) return
  looping = true
  lastNow = performance.now()
  requestAnimationFrame(frame)
}

function frame(now) {
  if (!cameraOn && !simOn) {
    looping = false
    return
  }
  try {
    draw(now)
  } catch (error) {
    statusEl.textContent = error && error.message ? error.message : '그리기 오류'
  }
  requestAnimationFrame(frame)
}

function resize() {
  const rect = stage.getBoundingClientRect()
  const dpr = Math.min(2, window.devicePixelRatio || 1)
  const w = Math.max(2, Math.round(rect.width * dpr))
  const h = Math.max(2, Math.round(rect.height * dpr))
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w
    canvas.height = h
  }
  return { w, h, dpr }
}

function draw(now) {
  const { w, h, dpr } = resize()
  const dt = takeDt(now)
  const rect = coverRect(video.videoWidth || w, video.videoHeight || h, w, h)

  ctx.clearRect(0, 0, w, h)
  if (cameraOn && video.readyState >= 2) {
    ctx.fillStyle = '#1c1916'
    ctx.fillRect(0, 0, w, h)
    ctx.save()
    if (settings.mirror) {
      ctx.translate(w, 0)
      ctx.scale(-1, 1)
    }
    ctx.drawImage(video, rect.x, rect.y, rect.w, rect.h)
    ctx.restore()
    handsPx = readHands(rect, w)
  } else if (simOn) {
    drawSimBackdrop(w, h)
    const radius = Math.min(w, h) * 0.2
    const open = opennessAt(now - simStarted)
    handsPx = syntheticHoleHands(w / 2, h / 2, radius, open)
  } else {
    handsPx = []
  }

  const minSide = Math.min(w, h)
  const det = detectHole(handsPx, {
    sensitivity: settings.sensitivity,
    minR: minSide * 0.055,
    maxR: minSide * 0.46,
  })
  followHole(det)
  const gains = springGains(settings.bounce, settings.emerge)
  const holding = det.open || (haveHole && miss < 8)
  stepSpring(spring, holding ? 1 : 0, dt, gains.stiffness, gains.damping)
  if (!Number.isFinite(spring.x) || spring.x > 2.2 || spring.x < -0.3) {
    spring.x = holding ? 1 : 0
    spring.v = 0
  }

  const img = images[settings.cat]
  if (simOn) drawSimPalms()
  if (img && img.complete && img.naturalWidth && haveHole && spring.x > 0.02) {
    drawCat(smooth.x, smooth.y, smooth.r, spring.x, img)
  }
  if (simOn) drawSimTips(dpr)
  if (settings.guide) drawGuide(det, dpr)
  if (settings.skeleton) drawSkeleton(dpr)
  writeReadout(det)
}

function readHands(rect, viewW) {
  if (!landmarker || video.readyState < 2) return []
  let ts = performance.now()
  if (ts <= lastTs) ts = lastTs + 1
  lastTs = ts
  let result
  try {
    result = landmarker.detectForVideo(video, ts)
  } catch {
    if (usingGpu && !switching) {
      switching = true
      usingGpu = false
      createLandmarker('CPU')
        .catch(() => { statusEl.textContent = '손 추적을 시작하지 못했어요' })
        .finally(() => { switching = false })
    }
    return []
  }
  return (result.landmarks || []).map((hand) => (
    hand.map((p) => mapLandmark(p.x, p.y, rect, settings.mirror, viewW))
  ))
}

function followHole(det) {
  if (det.open) {
    if (!haveHole || spring.x < 0.05) {
      smooth.x = det.x
      smooth.y = det.y
      smooth.r = det.r
      smooth.a = det.angle
    } else {
      smooth.x += (det.x - smooth.x) * 0.42
      smooth.y += (det.y - smooth.y) * 0.42
      smooth.r += (det.r - smooth.r) * 0.42
      smooth.a = lerpAngle(smooth.a, det.angle, 0.42)
    }
    haveHole = true
    miss = 0
    return
  }
  if (haveHole) miss += 1
  if (miss >= 8) {
    if (spring.x < 0.02) haveHole = false
  }
}

function drawCat(x, y, holeR, pop, img) {
  const emerge = settings.emerge / 100
  const grow = Math.min(1, Math.max(0, pop))
  const over = Math.max(0, pop - 1)
  let clipR = holeR * (0.92 + 0.28 * emerge) * (0.22 + 0.78 * grow) * (1 + over * 0.12)
  clipR = Math.min(clipR, holeR * 1.4)
  if (!(clipR > 4) || clipR > Math.min(wSafe(), 1600)) return
  const zoom = (settings.size / 100) * (1 + over * 0.28)
  const angle = settings.tilt ? smooth.a : 0
  const box = clipR * 2
  const scale = (box * zoom) / Math.min(img.width, img.height)
  const dw = img.width * scale
  const dh = img.height * scale
  const oy = ((settings.face - 50) / 50) * clipR

  const size = Math.ceil(clipR * 2 + 8)
  if (scratch.width !== size || scratch.height !== size) {
    scratch.width = size
    scratch.height = size
  }
  sctx.setTransform(1, 0, 0, 1, 0, 0)
  sctx.globalCompositeOperation = 'source-over'
  sctx.clearRect(0, 0, size, size)
  sctx.save()
  sctx.translate(size / 2, size / 2)
  sctx.rotate(angle)
  sctx.drawImage(img, -dw / 2, -dh / 2 + oy, dw, dh)
  sctx.restore()

  const falloff = 0.02 + (settings.feather / 100) * 0.42
  const mask = sctx.createRadialGradient(
    size / 2, size / 2, Math.max(0, clipR * (1 - falloff)),
    size / 2, size / 2, clipR,
  )
  mask.addColorStop(0, 'rgba(0,0,0,1)')
  mask.addColorStop(1, 'rgba(0,0,0,0)')
  sctx.globalCompositeOperation = 'destination-in'
  sctx.fillStyle = mask
  sctx.beginPath()
  sctx.arc(size / 2, size / 2, clipR, 0, Math.PI * 2)
  sctx.fill()
  sctx.globalCompositeOperation = 'source-over'

  ctx.save()
  ctx.shadowColor = `rgba(48, 32, 18, ${0.3 * grow})`
  ctx.shadowBlur = clipR * 0.2
  ctx.drawImage(scratch, x - size / 2, y - size / 2)
  ctx.restore()

  ctx.save()
  ctx.beginPath()
  ctx.arc(x, y, clipR, 0, Math.PI * 2)
  ctx.clip()
  const shade = ctx.createRadialGradient(x, y, clipR * 0.58, x, y, clipR)
  shade.addColorStop(0, 'rgba(0,0,0,0)')
  shade.addColorStop(1, 'rgba(36, 22, 12, 0.4)')
  ctx.fillStyle = shade
  ctx.fillRect(x - clipR, y - clipR, clipR * 2, clipR * 2)
  ctx.restore()
}

function drawSimPalms() {
  ctx.save()
  for (const hand of handsPx) {
    const wrist = hand[0]
    const reach = Math.hypot(hand[12].x - wrist.x, hand[12].y - wrist.y) || 80
    ctx.fillStyle = 'rgba(214, 176, 156, 0.92)'
    ctx.beginPath()
    ctx.ellipse(wrist.x, wrist.y, reach * 0.34, reach * 0.46, 0, 0, Math.PI * 2)
    ctx.fill()
  }
  ctx.restore()
}

function drawSimTips(dpr) {
  ctx.save()
  ctx.fillStyle = 'rgba(92, 70, 56, 0.88)'
  for (const hand of handsPx) {
    for (const i of [4, 8, 12]) {
      ctx.beginPath()
      ctx.arc(hand[i].x, hand[i].y, 7 * dpr, 0, Math.PI * 2)
      ctx.fill()
    }
  }
  ctx.restore()
}

function drawGuide(det, dpr) {
  const hole = det.open ? smooth : det
  if (!(hole.r > 8)) return
  ctx.save()
  ctx.beginPath()
  ctx.arc(hole.x, hole.y, hole.r, 0, Math.PI * 2)
  ctx.strokeStyle = det.open ? 'rgba(90, 72, 56, 0.9)' : 'rgba(90, 72, 56, 0.35)'
  ctx.lineWidth = 1.5 * dpr
  ctx.setLineDash([5 * dpr, 5 * dpr])
  ctx.stroke()
  ctx.restore()
}

function drawSkeleton(dpr) {
  ctx.save()
  ctx.lineWidth = 1.4 * dpr
  ctx.strokeStyle = 'rgba(86, 74, 62, 0.55)'
  ctx.fillStyle = 'rgba(86, 74, 62, 0.8)'
  for (const hand of handsPx) {
    ctx.beginPath()
    for (const [a, b] of BONES) {
      ctx.moveTo(hand[a].x, hand[a].y)
      ctx.lineTo(hand[b].x, hand[b].y)
    }
    ctx.stroke()
    for (const point of hand) {
      ctx.beginPath()
      ctx.arc(point.x, point.y, 2.2 * dpr, 0, Math.PI * 2)
      ctx.fill()
    }
  }
  ctx.restore()
}

function drawSimBackdrop(w, h) {
  const g = ctx.createLinearGradient(0, 0, 0, h)
  g.addColorStop(0, '#f7f2eb')
  g.addColorStop(1, '#e6ddd2')
  ctx.fillStyle = g
  ctx.fillRect(0, 0, w, h)
}

function writeReadout(det) {
  if (!cameraOn && !simOn) return
  statusEl.textContent = REASON[det.reason] || REASON.wait
  if (det.reason === 'wait') {
    numsEl.textContent = '원형도 — · 틈 —'
    return
  }
  const circ = Math.round(det.circularity * 100)
  numsEl.textContent = `원형도 ${circ}% · 틈 ${det.gap.toFixed(2)} · 지름 ${Math.round(det.r * 2)}`
}

function opennessAt(elapsed) {
  const p = (elapsed % 6400) / 6400
  if (p < 0.52) return 0
  if (p < 0.68) return (p - 0.52) / 0.16
  if (p < 0.86) return 1
  return 1 - (p - 0.86) / 0.14
}

function takeDt(now) {
  const raw = (now - lastNow) / 1000
  lastNow = now
  if (!Number.isFinite(raw) || raw <= 0 || raw > 0.1) {
    spring.v = 0
    return 1 / 60
  }
  return raw
}

function wSafe() {
  return canvas.width || 800
}

function lerpAngle(a, b, t) {
  let d = b - a
  while (d > Math.PI) d -= Math.PI * 2
  while (d < -Math.PI) d += Math.PI * 2
  return a + d * t
}
</script>
