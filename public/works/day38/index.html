<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Day 38: 접기</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #111; font-family: "Noto Sans KR", system-ui, sans-serif; color: #fff; user-select: none; }
  #panels { position: absolute; inset: 0; display: flex; }
  .panel { position: relative; flex: 1; overflow: hidden; }
  .panel video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .panel .credit { position: absolute; right: 8px; bottom: 6px; font-size: 9px; color: rgba(255,255,255,.75); text-shadow: 0 1px 2px rgba(0,0,0,.6); text-align: right; }
  canvas { position: absolute; inset: 0; display: block; pointer-events: none; z-index: 2; }
  /* 서랍: 왼쪽 아래에 붙은 유리판(애플 리퀴드 글래스 느낌). 손잡이는 같은 면이 오른쪽 위로 이어진 탭 */
  #drawer { position: absolute; left: 0; bottom: 56px; z-index: 3; transition: transform .5s cubic-bezier(.3, .8, .3, 1); }
  #drawer.shut { transform: translateX(-100%); }
  #tray { position: relative; display: flex; flex-direction: column; gap: 21px; padding: 29px 31px; border-radius: 0 0 34px 0; }
  #tray, #handle {
    background: linear-gradient(135deg, rgba(255,255,255,.34) 0%, rgba(255,255,255,.12) 45%, rgba(255,255,255,.2) 100%);
    backdrop-filter: blur(22px) saturate(1.8) brightness(1.06); -webkit-backdrop-filter: blur(22px) saturate(1.8) brightness(1.06);
    box-shadow: inset 1px 1px 0 rgba(255,255,255,.65), inset -1px -1px 0 rgba(255,255,255,.18), inset 0 0 18px rgba(255,255,255,.12), 0 12px 32px rgba(0,0,0,.16);
  }
  /* 유리 위 반사광 */
  #tray::before { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: radial-gradient(120% 60% at 15% 0%, rgba(255,255,255,.35), rgba(255,255,255,0) 55%); mix-blend-mode: screen; }
  .sheet { width: 50px; height: 50px; cursor: pointer; position: relative; transition: transform .3s cubic-bezier(.3, 1.3, .5, 1); }
  .sheet img { width: 100%; height: 100%; display: block; border-radius: 3px; box-shadow: 0 3px 8px rgba(0,0,0,.2); }
  .sheet:hover { transform: translateX(5px); }
  #handle { position: absolute; left: 100%; top: 0; width: 34px; height: 125px; border-radius: 0 21px 21px 0; cursor: pointer; box-shadow: inset -1px 1px 0 rgba(255,255,255,.55), inset -1px -1px 0 rgba(255,255,255,.18), 8px 12px 28px rgba(0,0,0,.12); }
  #hint { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 3; font-size: 13px; font-weight: 500; text-shadow: 0 1px 4px rgba(0,0,0,.7); transition: opacity .5s; white-space: nowrap; pointer-events: none; }
</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js" } }</script>
</head>
<body>
<div id="panels">
  <div class="panel"><video src="videos/grass.mp4" muted loop autoplay playsinline></video><div class="credit">A rice field — Jnanaranjan sahu, CC BY-SA 3.0</div></div>
  <div class="panel"><video src="videos/pigeons.mp4" muted loop autoplay playsinline></video><div class="credit">Birdoj sur placo de Unueco kaj Konsento (Tjumeno) — RG72, CC BY-SA 4.0</div></div>
  <div class="panel"><video src="videos/tree.mp4" muted loop autoplay playsinline></video><div class="credit">Birds perched on a bare tree in Bidibidi — Oliversamson1, CC BY-SA 4.0</div></div>
</div>
<div id="drawer">
  <div id="tray">
    <div class="sheet" data-k="robin"><img src="art3/robin-sheet.jpg" alt="산새 색종이"></div>
    <div class="sheet" data-k="pigeon"><img src="art3/pigeon-sheet.jpg" alt="비둘기 색종이"></div>
    <div class="sheet" data-k="sparrow"><img src="art3/sparrow-sheet.jpg" alt="참새 색종이"></div>
  </div>
  <div id="handle" title="서랍 열고 닫기"></div>
</div>
<div id="hint">색종이를 눌러 보세요</div>
<script type="module" src="./fold3d.js?v=4"></script>
</body>
</html>
