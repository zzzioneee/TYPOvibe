<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Day 38: 3D 종이 시제품</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #111; font-family: "Noto Sans KR", system-ui, sans-serif; color: #fff; }
  #bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  canvas { position: absolute; inset: 0; display: block; }
  #pills { position: absolute; z-index: 5; left: 50%; bottom: 22px; transform: translateX(-50%); display: flex; gap: 8px; }
  .pill { font: 700 13px "Noto Sans KR", sans-serif; padding: .5em 1.2em .55em; border-radius: 999px; border: 1.5px solid #fff; background: rgba(0,0,0,.25); color: #fff; cursor: pointer; white-space: nowrap; backdrop-filter: blur(6px); }
  .pill:hover { background: #fff; color: #111; }
  #credit { position: absolute; z-index: 5; right: 12px; bottom: 6px; font-size: 10px; color: rgba(255,255,255,.7); }
</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js" } }</script>
</head>
<body>
<video id="bg" src="videos/pigeons.mp4" muted loop autoplay playsinline></video>
<div id="pills"><button class="pill" data-k="sparrow">참새 접기</button><button class="pill" data-k="pigeon">비둘기 접기</button><button class="pill" data-k="robin">산새 접기</button></div>
<div id="credit">배경 영상: Birdoj sur placo de Unueco kaj Konsento (Tjumeno) — RG72, CC BY-SA 4.0</div>
<script type="module">
import * as THREE from 'three';
const D = Math.PI / 180;

// 새마다: 참고 이미지(ref)의 완성 새 그림을 그대로 종이 면으로 쓰고, 날개·머리만 접선(경첩)으로 움직인다.
// 좌표는 그림의 긴 변을 1로 둔 값(왼쪽 위 0,0).
const BIRDS = {
  sparrow: { mode: 'fly', size: 1.6,
    wing: { poly: [[.27, .47], [.29, .30], [.70, -.03], [.92, .12], [.53, .58]], hinge: [[.27, .47], [.53, .58]] } },
  pigeon: { mode: 'walk', size: 1.35 },
  robin: { mode: 'flywalk', size: 1.7,
    wing: { poly: [[.31, .19], [.36, .04], [1.02, -.03], [.96, .22], [.64, .47], [.53, .50]], hinge: [[.31, .19], [.53, .50]] } },
};

// ---------- 장면 ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); document.body.appendChild(renderer.domElement);
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, 1, .1, 200); camera.position.set(0, 0, 14);
scene.add(new THREE.HemisphereLight(0xffffff, 0xb8b0a6, 2.1));
const sun = new THREE.DirectionalLight(0xfff4e6, 1.5); sun.position.set(3, 5, 8); scene.add(sun);
const VH = () => 2 * camera.position.z * Math.tan(15 * D), VW = () => VH() * camera.aspect;
function resize() { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
// 화면 비율 좌표(fx, fy)와 깊이 z → 세계 좌표 (원근을 감안해 화면 위치가 유지되게)
function at(fx, fy, z = 0) { const k = (camera.position.z - z) / camera.position.z; return new THREE.Vector3((fx - .5) * VW() * k, (.5 - fy) * VH() * k, z); }

const loader = new THREE.TextureLoader();
const tex = (u) => { const t = loader.load(u); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t; };
const paperMat = (map, alpha) => new THREE.MeshStandardMaterial({ map, roughness: .95, metalness: 0, side: THREE.DoubleSide, alphaTest: alpha ? .5 : 0 });

// 경첩: 점 p를 지나는 선(방향 d)을 축으로 도는 무리. sign=+1이면 양(+)으로 돌 때 c(조각 중심)가 카메라 쪽으로 들린다
function hinge(parent, p, d, c, sign = 1) {
  const g = new THREE.Group(); g.position.set(p[0], p[1], 0); parent.add(g);
  const inner = new THREE.Group(); inner.position.set(-p[0], -p[1], 0); g.add(inner);
  const ax = new THREE.Vector3(d[0], d[1], 0).normalize();
  const vx = c[0] - p[0], vy = c[1] - p[1];
  if ((ax.x * vy - ax.y * vx) * sign < 0) ax.negate();
  g.userData.set = (a) => g.quaternion.setFromAxisAngle(ax, a);
  return { g, inner };
}
function poly(pts, uvOf, z = 0, holes = []) {
  const sh = new THREE.Shape(pts.map(([x, y]) => new THREE.Vector2(x, y)));
  holes.forEach((h) => sh.holes.push(new THREE.Path(h.map(([x, y]) => new THREE.Vector2(x, y)))));
  const geo = new THREE.ShapeGeometry(sh), pos = geo.attributes.position, uv = geo.attributes.uv;
  for (let i = 0; i < pos.count; i++) { const [u, v] = uvOf(pos.getX(i), pos.getY(i)); uv.setXY(i, u, v); pos.setZ(i, z); }
  geo.computeVertexNormals(); return geo;
}
const cen = (pts) => [pts.reduce((a, p) => a + p[0], 0) / pts.length, pts.reduce((a, p) => a + p[1], 0) / pts.length];

// ---------- 접는 종이 (참고 전개도 그대로) ----------
// 정사각(-1~1)을 대각선으로 반 접고 → 양 끝 모서리 → 직각 모서리를 차례로 접는다.
function makeSheet(k) {
  const map = tex(`art3/${k}-sheet.jpg`), mat = paperMat(map);
  const root = new THREE.Group(), parts = [];
  const uvOf = (x, y) => [(x + 1) / 2, (y + 1) / 2];
  for (const s of [1, -1]) {
    const sw = (p) => (s > 0 ? p : [p[1], p[0]]);   // 다른 반쪽은 대각선에 대해 뒤집은 자리
    const P = (arr) => arr.map(sw), z = s > 0 ? 0 : -.006;
    let base = root, diag = null;
    if (s < 0) { diag = hinge(root, [0, 0], [1, 1], sw([.5, -.5]), 1); base = diag.inner; }
    const body = P([[-.3, -1], [.35, -1], [1, -.35], [1, .3], [.65, .65], [-.65, -.65]]);
    base.add(new THREE.Mesh(poly(body, uvOf, z), mat));
    const fl = [
      { pts: [[-1, -1], [-.3, -1], [-.65, -.65]], h: [[-.3, -1], [-.65, -.65]] },
      { pts: [[1, 1], [.65, .65], [1, .3]], h: [[.65, .65], [1, .3]] },
      { pts: [[1, -1], [1, -.35], [.35, -1]], h: [[.35, -1], [1, -.35]] },
    ].map((f) => {
      const pts = P(f.pts), h = P(f.h);
      const hg = hinge(base, h[0], [h[1][0] - h[0][0], h[1][1] - h[0][1]], cen(pts), s);
      hg.inner.add(new THREE.Mesh(poly(pts, uvOf, z), mat)); return hg.g;
    });
    parts.push({ diag: diag && diag.g, fl });
  }
  root.userData.set = (S) => {
    for (const p of parts) {
      if (p.diag) p.diag.userData.set(S.fold * 180 * D);
      p.fl[0].userData.set(S.c1 * 175 * D); p.fl[1].userData.set(S.c1 * 175 * D); p.fl[2].userData.set(S.c2 * 175 * D);
    }
  };
  return root;
}

// ---------- 완성 새 (참고 완성작 그림 그대로, 날개·머리만 경첩) ----------
const IMG = { sparrow: [879, 1023], pigeon: [1024, 991], robin: [1001, 1023] };
function makeBird(k) {
  const b = BIRDS[k], map = tex(`art3/${k}-bird.webp`), mat = paperMat(map, true);
  const img = IMG[k], aw = img[0] / Math.max(...img), ah = img[1] / Math.max(...img);
  const M = ([x, y]) => [x - aw / 2, ah / 2 - y];               // 그림 좌표 → 모형 좌표(위로 +, 가운데 0)
  const uvOf = (x, y) => [(x + aw / 2) / aw, (y + ah / 2) / ah];
  const g = new THREE.Group();
  const rect = [[0, 0], [aw, 0], [aw, ah], [0, ah]].map(M);
  const cut = b.wing || b.head, holes = cut ? [cut.poly.map(M)] : [];
  g.add(new THREE.Mesh(poly(rect, uvOf, 0, holes), mat));
  if (b.wing) {
    const h = b.wing.hinge.map(M), pts = b.wing.poly.map(M);
    const hg = hinge(g, h[0], [h[1][0] - h[0][0], h[1][1] - h[0][1]], cen(pts), 1);
    hg.inner.add(new THREE.Mesh(poly(pts, uvOf, .002), mat)); g.userData.wing = hg.g;
  }
  if (b.head) {
    const pv = M(b.head.pivot), pts = b.head.poly.map(M);
    const hg = new THREE.Group(); hg.position.set(pv[0], pv[1], 0); g.add(hg);
    const m = new THREE.Mesh(poly(pts, uvOf, .002), mat); m.position.set(-pv[0], -pv[1], 0); hg.add(m); g.userData.head = hg;
  }
  return g;
}

// ---------- 흐름 ----------
const ease = (t) => (t < .5 ? 4 * t * t * t : 1 - (-2 * t + 2) ** 3 / 2);
const inQ = (t) => t * t * t, outQ = (t) => 1 - (1 - t) ** 3;
const flock = [];
let job = null;
function fold(k) {
  if (job) return; audio();
  const sheet = makeSheet(k), spot = at(.3, .5, 0); sheet.position.copy(spot); sheet.scale.setScalar(1.15); scene.add(sheet);
  const S = { fold: 0, c1: 0, c2: 0 }; sheet.userData.set(S);
  sheet.rotation.set(-14 * D, 10 * D, 0);
  job = { k, sheet, S, t: 0, spot, step: -1 };
}
// 순서: 대각선 반 접기 → 양 끝 모서리 → 직각 모서리 → 모로 세우며 새로
const PLAN = [['fold', 1.1], ['c1', .8], ['c2', .7], ['turn', .32], ['born', .5]];
function runJob(dt) {
  const j = job; j.t += dt;
  let acc = 0, i = 0; for (; i < PLAN.length; i++) { if (j.t < acc + PLAN[i][1]) break; acc += PLAN[i][1]; }
  if (i !== j.step) { j.step = i; if (i < 3) rustle(); }
  if (i >= PLAN.length) { if (j.o) { j.bird.rotation.y = 0; j.o.live = true; j.o.t0 = performance.now() / 1000; } job = null; return; }
  const [name, dur] = PLAN[i], p = Math.min(1, (j.t - acc) / dur);
  for (let q = 0; q < i && q < 3; q++) j.S[PLAN[q][0]] = 1;
  if (i < 3) { j.S[name] = ease(p); j.sheet.userData.set(j.S); }
  if (name === 'turn') { j.sheet.rotation.y = 10 * D + inQ(p) * 80 * D; j.sheet.scale.setScalar(1.15 * (1 - .25 * p)); }
  if (name === 'born') {
    if (!j.bird) {   // 종이가 모로 선(보이지 않는) 순간에 새로 바뀐다
      scene.remove(j.sheet); crease();
      const bird = makeBird(j.k); bird.position.copy(j.spot); scene.add(bird); j.bird = bird;
      j.o = spawn(j.k, bird);
    }
    j.bird.rotation.y = (-90 + outQ(p) * 90) * D; j.o.size = 2.4 - .2 * p; j.bird.scale.setScalar(j.o.size);
  }
}
function spawn(k, g) {
  const o = { k, g, b: BIRDS[k], dir: 1, turn: 0, size: 1.6, seed: Math.random() * 100, live: false };
  flock.push(o); return o;
}
// 단단한 종이처럼: 몸은 미끄러지고, 방향을 바꿀 땐 종이 한 장이 뒤집히듯 돈다
function target(o, t) {
  const s = o.seed, a = t - o.t0; let mode = o.b.mode;
  if (mode === 'flywalk') mode = ((a + s) % 20) < 12 ? 'fly' : 'walk';
  if (mode === 'fly') { const fx = .55 + .32 * Math.sin(a * .21 + s), fy = .2 + .08 * Math.sin(a * .37 + s * 2), z = -6 + 4 * Math.sin(a * .13 + s); return { p: at(fx, fy, z), fly: true }; }
  const fx = .45 + .32 * Math.sin(a * .06 + s), z = -4.5 + 3.5 * Math.sin(a * .045 + s);
  const fy = .69 + .2 * (z + 8) / 8;   // 멀수록 지평선 쪽(위)으로 — 영상의 높은 눈높이에 맞춘 바닥
  return { p: at(fx, fy, z), fly: false };
}
function tick(o, t, dt) {
  if (!o.live) return;
  const g = target(o, t), a = t - o.t0, k = Math.min(1, dt * (a < 3 ? .9 : 1.4));
  const prev = o.g.position.x; o.g.position.lerp(g.p, k);
  const vx = o.g.position.x - prev; if (Math.abs(vx) > .002) o.dir = vx > 0 ? 1 : -1;
  o.turn += ((o.dir > 0 ? 0 : 180) - o.turn) * Math.min(1, dt * 3);
  const peck = g.fly ? 0 : (Math.sin(a * 1.9 + o.seed) > .9 ? -10 : Math.sin(a * 6) * 1.5);   // 걸을 땐 몸 전체로 까딱
  o.g.rotation.order = 'YXZ';
  o.g.rotation.set(g.fly ? 0 : -24 * D, o.turn * D + (g.fly ? -8 : -4) * D, g.fly ? Math.max(-.25, Math.min(.25, (g.p.y - o.g.position.y) * .15)) * o.dir : peck * D * o.dir);
  const want = o.b.size * (g.fly ? 1 : 1.15); o.size += (want - o.size) * Math.min(1, dt * 1.5); o.g.scale.setScalar(o.size);
  if (o.g.userData.wing) o.g.userData.wing.userData.set(g.fly ? (Math.sin(a * 10) * 32 + 4) * D : 62 * D);  // 걸을 땐 날개를 접어 둔다
}

// ---------- 소리 ----------
let ac; function audio() { if (!ac) ac = new AudioContext(); if (ac.state === 'suspended') ac.resume(); document.getElementById('bg').play().catch(() => {}); }
function noise(dur, fill, hp, vol) {
  if (!ac) return; const b = ac.createBuffer(1, ac.sampleRate * dur | 0, ac.sampleRate); fill(b.getChannelData(0), ac.sampleRate);
  const s = ac.createBufferSource(), h = ac.createBiquadFilter(), g = ac.createGain(); h.type = 'highpass'; h.frequency.value = hp; g.gain.value = vol;
  s.buffer = b; s.connect(h).connect(g).connect(ac.destination); s.start();
}
function rustle() { noise(.55, (d, sr) => { for (let k = 0; k < 60; k++) { const st = Math.random() * (d.length - sr * .015) | 0, len = sr * (.002 + Math.random() * .01) | 0, amp = Math.random() ** 2; for (let i = 0; i < len; i++) d[st + i] += (Math.random() * 2 - 1) * amp * Math.exp(-i / (len * .3)); } for (let i = 0; i < d.length; i++) d[i] += (Math.random() * 2 - 1) * .08 * Math.sin(Math.PI * i / d.length); }, 1300, .28); }
function crease() { noise(.09, (d) => { for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.sin(Math.PI * i / d.length) ** 2; }, 2500, .16); }

document.querySelectorAll('.pill').forEach((b) => (b.onclick = () => fold(b.dataset.k)));
let last = performance.now() / 1000;
(function frame() {
  const t = performance.now() / 1000, dt = Math.min(.05, t - last); last = t;
  if (job) runJob(dt);
  for (const o of flock) tick(o, t, dt);
  renderer.render(scene, camera); requestAnimationFrame(frame);
})();
window.__fold = fold;
</script>
</body>
</html>
