<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Day 29: 소음</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #2a261f; }
    canvas { display: block; width: 100%; height: 100%; }
    #sound-toggle {
      position: absolute; z-index: 5; top: clamp(12px, 2vw, 28px); right: clamp(12px, 2.2vw, 34px);
      display: flex; align-items: center; gap: 9px; padding: 10px 14px;
      border: 1px solid rgba(0,0,0,.2); border-radius: 24px;
      background: rgba(240,232,214,.78); color: #292825;
      font: 500 11px/1.2 system-ui, sans-serif; letter-spacing: .07em;
      cursor: pointer; backdrop-filter: blur(8px);
    }
    #sound-toggle:before { content: ''; width: 6px; height: 6px; border: 1px solid currentColor; border-radius: 50%; }
    #sound-toggle[aria-pressed="true"]:before { background: currentColor; }
    html.thumb #sound-toggle, html.thumb #hint, html.thumb #trail-panel { display: none; }
    #hint {
      position: absolute; left: 18px; bottom: 16px;
      font: 500 11px/1.4 system-ui, sans-serif; letter-spacing: .06em;
      color: rgba(255,244,220,.72); pointer-events: none;
    }
    #trail-panel {
      position: absolute; z-index: 5; left: clamp(12px, 2vw, 28px); top: clamp(12px, 2vw, 28px);
      width: min(220px, calc(100% - 160px));
      padding: 12px 14px 10px;
      border: 1px solid rgba(0,0,0,.18);
      border-radius: 16px;
      background: rgba(240,232,214,.82);
      color: #292825;
      font: 500 12px/1.3 system-ui, sans-serif;
      backdrop-filter: blur(8px);
    }
    #trail-panel .slider { display: block; margin: 0 0 10px; }
    #trail-panel .slider:last-child { margin: 0; }
    #trail-panel .slider-top {
      display: flex; justify-content: space-between; gap: 10px; margin-bottom: 4px;
      letter-spacing: .04em;
    }
    #trail-panel .slider-top b { font-weight: 510; font-variant-numeric: tabular-nums; opacity: .62; }
    #trail-panel input[type="range"] {
      -webkit-appearance: none; appearance: none;
      width: 100%; height: 16px; margin: 0; background: transparent; cursor: pointer;
    }
    #trail-panel input[type="range"]::-webkit-slider-runnable-track {
      height: 2px; border-radius: 2px; background: #b9ae98;
    }
    #trail-panel input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 14px; height: 14px; margin-top: -6px;
      border-radius: 50%; background: #fff;
      box-shadow: 0 0 0 0.5px rgba(0,0,0,.12), 0 1px 3px rgba(0,0,0,.18);
    }
    #trail-panel input[type="range"]::-moz-range-track {
      height: 2px; border: 0; border-radius: 2px; background: #b9ae98;
    }
    #trail-panel input[type="range"]::-moz-range-thumb {
      width: 14px; height: 14px; border: 0; border-radius: 50%; background: #fff;
    }
    #loading {
      position: absolute; inset: 0; display: grid; place-items: center;
      color: #efe6d2; font: 500 13px/1.4 system-ui, sans-serif; letter-spacing: .16em;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <canvas id="view"></canvas>
  <button id="sound-toggle" type="button" aria-pressed="false" aria-label="효과음 켜기">Sound Off</button>
  <aside id="trail-panel">
    <label class="slider">
      <span class="slider-top"><span>잔상</span><b id="density-val">5</b></span>
      <input id="density" type="range" min="0" max="8" value="5" />
    </label>
    <label class="slider">
      <span class="slider-top"><span>간격</span><b id="length-val">70ms</b></span>
      <input id="length" type="range" min="0" max="100" value="30" />
    </label>
  </aside>
  <div id="hint">SPACE 멈춤 · Sound On 으로 BGM·효과음</div>
  <div id="loading">LOADING</div>
  <script type="module" src="./noise.js"></script>
</body>
</html>
