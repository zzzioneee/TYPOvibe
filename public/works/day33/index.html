<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Day 33: 별소리</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #f2eee7; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
    canvas:active { cursor: grabbing; }
    #ui { position: absolute; inset: 0; pointer-events: none; font-family: "Noto Sans KR", system-ui, sans-serif; color: #1b1b1d; }
    /* 어떤 톤이어도 자막은 같은 한 줄 */
    #sub {
      position: absolute; left: 50%; bottom: 9vh; transform: translateX(-50%);
      font-size: clamp(16px, 2.6vh, 22px); font-weight: 500; white-space: nowrap;
      background: rgba(255, 255, 255, .55); border-radius: 999px; padding: .4em 1.1em .45em;
      opacity: 0; transition: opacity .3s;
    }
    #tone {
      position: absolute; left: 50%; bottom: calc(9vh + clamp(16px, 2.6vh, 22px) * 2.5); transform: translateX(-50%);
      font-size: 12px; letter-spacing: .14em; color: rgba(27, 27, 29, .5); white-space: nowrap;
      opacity: 0; transition: opacity .3s;
    }
    body.said #sub, body.said #tone { opacity: 1; }
    #hint {
      position: absolute; left: 50%; top: 26px; transform: translateX(-50%);
      display: flex; gap: 20px; white-space: nowrap; font-size: 12px; letter-spacing: .08em; color: rgba(27, 27, 29, .5);
    }
    #hint i { font-style: normal; font-weight: 500; color: #1b1b1d; margin-right: 7px; }
    #credit { position: absolute; right: 22px; bottom: 16px; font-size: 10px; letter-spacing: .06em; color: rgba(27, 27, 29, .35); }
    @media (max-width: 560px) { #hint { gap: 12px; font-size: 11px; } }
    html.thumb #hint, html.thumb #credit { display: none; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js"
    }
  }
  </script>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="ui">
    <div id="hint">
      <span><i>↑↓←→</i>입 벌리기</span>
      <span><i>손 떼면</i>한 마디</span>
      <span><i>클릭 · Space</i>아무 말</span>
    </div>
    <div id="tone"></div>
    <div id="sub"></div>
    <div id="credit">음성 · Google Cloud TTS</div>
  </div>
  <script type="module" src="./star.js"></script>
</body>
</html>
