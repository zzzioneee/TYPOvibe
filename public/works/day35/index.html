<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Day 35: 포장지 공장</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;900&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a0b; font-family: "Noto Sans KR", system-ui, sans-serif; color: #111; }
    canvas#view { display: block; width: 100%; height: 100%; }
    /* ① 그리기는 왼쪽, ② 포장지는 오른쪽: 하는 일이 다른 두 구좌를 떼어 둔다 */
    .side { position: absolute; top: 20px; width: 330px; max-height: calc(100% - 40px); overflow-y: auto; scrollbar-width: none; }
    .side::-webkit-scrollbar { display: none; }
    #panel { left: 20px; }
    #panel2 { right: 20px; }
    hr { border: 0; border-top: 1.5px solid #ece8e1; margin: 18px 0 14px; }
    .card { background: rgba(255, 255, 255, .95); border-radius: 18px; padding: 16px 16px 18px; box-shadow: 0 10px 30px rgba(0, 0, 0, .35); }
    .card.paper { background: rgba(244, 240, 232, .96); }
    .head { display: flex; align-items: baseline; gap: 8px; }
    .num { width: 20px; height: 20px; border-radius: 50%; background: #111; color: #fff; font-size: 11px; font-weight: 900; display: inline-flex; align-items: center; justify-content: center; flex: none; transform: translateY(3px); }
    h2 { font-size: 15px; font-weight: 900; }
    .sub { font-size: 11px; color: #8a847b; margin: 3px 0 0 28px; }
    .sec { margin-top: 12px; }
    .lab { font-size: 11px; font-weight: 500; color: #8a847b; letter-spacing: .06em; margin-bottom: 7px; display: flex; justify-content: space-between; }
    .row { display: flex; flex-wrap: wrap; gap: 6px; }
    button.pill {
      font: inherit; font-size: 12px; font-weight: 500; cursor: pointer; white-space: nowrap;
      padding: .38em .85em .42em; border-radius: 999px; border: 1.5px solid #111; color: #111; background: #fff;
      transition: background-color .15s, color .15s;
    }
    button.pill:hover { background: #f1f1f1; }
    button.pill.on { background: #111; color: #fff; }
    .brushes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-top: 10px; }
    .brushes button { font: inherit; font-size: 10px; font-weight: 500; cursor: pointer; border: 1.5px solid #111; background: #fff; border-radius: 999px; padding: 4px 6px; display: flex; align-items: center; justify-content: center; gap: 4px; white-space: nowrap; }
    .brushes button canvas { width: 26px; height: 12px; }
    .brushes button.on { background: #111; color: #fff; }
    #pad { display: block; width: 100%; aspect-ratio: 1; max-width: 298px; margin: 10px auto 0; border-radius: 12px; touch-action: none; cursor: crosshair; border: 1.5px solid #111; }
    input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 6px; border-radius: 999px; outline: none; cursor: pointer; margin: 0; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #fff; border: 1.5px solid #111; box-shadow: 0 1px 4px rgba(0, 0, 0, .3); }
    input[type=range]::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: #fff; border: 1.5px solid #111; }
    .hue { background: linear-gradient(90deg, hsl(0,85%,50%), hsl(60,85%,50%), hsl(120,85%,50%), hsl(180,85%,50%), hsl(240,85%,50%), hsl(300,85%,50%), hsl(360,85%,50%)); }
    .size { background: linear-gradient(90deg, #ddd, #111); height: 4px; }
    .picker { display: grid; grid-template-columns: 30px 1fr; gap: 8px; align-items: center; }
    .line { display: flex; align-items: center; gap: 10px; }
    .line .lab { margin: 0; flex: none; }
    #sizeVal { width: 16px; justify-content: flex-end; }
    .picker .chip { width: 30px; height: 30px; border-radius: 10px; border: 1.5px solid rgba(0, 0, 0, .15); cursor: pointer; position: relative; }
    .picker .bars { display: flex; flex-direction: column; gap: 10px; }
    .picker .eye { width: 30px; height: 30px; padding: 0; font-size: 14px; }
    .picker .tools { grid-column: 2; display: flex; gap: 6px; }
    .picker input[type=color] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
    #preview { display: block; width: 252px; height: 84px; border-radius: 10px; margin-top: 4px; }
    #wrap {
      width: 100%; font: inherit; font-size: 14px; font-weight: 900; letter-spacing: .04em; cursor: pointer;
      padding: .85em 0; border-radius: 999px; border: 0; background: #111; color: #fff; margin-top: 14px;
    }
    #wrap:disabled { opacity: .35; cursor: default; }
    #hint { position: absolute; right: 22px; bottom: 18px; font-size: 11px; letter-spacing: .06em; color: rgba(255, 255, 255, .45); text-align: right; }
    @media (max-width: 700px) {
      #panel { top: auto; left: 10px; right: 10px; bottom: 10px; width: auto; height: 50vh; }
      #panel2 { top: 10px; left: 10px; right: 10px; width: auto; max-height: 30vh; }
      #pad { width: 200px; height: 200px; }
      #hint { display: none; }
    }
    html.thumb #panel, html.thumb #panel2, html.thumb #hint { display: none; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="panel" class="side">
    <div class="card">
      <h2>무늬 그리기</h2>
      <canvas id="pad"></canvas>
      <div class="brushes" id="brushes"></div>
      <div class="sec line"><span class="lab">굵기</span><input type="range" class="size" id="size" min="1" max="20" value="7" /><span class="lab" id="sizeVal"></span></div>
      <div class="sec"><div class="lab">펜 색</div><div class="picker" id="penPicker"></div></div>
      <div class="sec"><div class="lab">바탕 색</div><div class="picker" id="bgPicker"></div></div>
      <div class="row" style="margin-top:12px"><button class="pill" id="undo">되돌리기</button><button class="pill" id="clear">비우기</button></div>

      <hr />
      <h2>포장지 만들기</h2>
      <div class="sec"><div class="lab">포장지 패턴 반복</div><div class="row" id="repeat"></div></div>
      <div class="sec"><div class="lab">패턴 크기</div><div class="row" id="scale"></div></div>
      <button id="wrap">이 포장지로 상자 포장하기</button>
    </div>
  </div>
  <div id="hint">드래그 · 둘러보기<br />휠 · 가까이</div>
  <script type="module" src="./factory.js"></script>
</body>
</html>
