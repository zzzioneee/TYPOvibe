<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Day 30: 지도 밖</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #9eb6c8; }
    canvas { display: block; width: 100%; height: 100%; }
    .from-wrap {
      position: fixed; top: 24px; left: 50%; transform: translateX(-50%); z-index: 100;
    }
    .from-link {
      font-family: system-ui, sans-serif; font-size: 20px; font-weight: 500;
      color: rgba(255,255,255,0.72); text-decoration: none; letter-spacing: 0.15em;
      text-shadow: 0 1px 8px rgba(0,0,0,.35);
    }
    .from-link:hover { color: #fff; }
    #cities {
      position: absolute; z-index: 5; top: clamp(12px, 2vw, 28px); left: clamp(12px, 2vw, 28px);
      display: flex; gap: 6px; flex-wrap: wrap;
    }
    #cities button, #reset {
      padding: 10px 14px; border: 1px solid rgba(255,255,255,.28); border-radius: 24px;
      background: rgba(12,16,22,.55); color: #fff;
      font: 500 11px/1.2 system-ui, sans-serif; letter-spacing: .08em;
      cursor: pointer; backdrop-filter: blur(8px);
    }
    #cities button[aria-pressed="true"] { background: #fff; color: #111; border-color: #fff; }
    #reset {
      position: absolute; z-index: 5; top: clamp(12px, 2vw, 28px); right: clamp(12px, 2.2vw, 34px);
    }
    #hint {
      position: absolute; left: 18px; bottom: 36px; z-index: 5;
      font: 500 12px/1.45 system-ui, sans-serif; letter-spacing: .04em;
      color: rgba(255,255,255,.82); pointer-events: none;
      text-shadow: 0 1px 8px rgba(0,0,0,.45);
    }
    #credits {
      position: absolute; left: 18px; bottom: 10px; z-index: 5;
      font: 400 10px/1.3 system-ui, sans-serif; color: rgba(255,255,255,.55);
      pointer-events: none;
    }
    #status {
      position: absolute; right: 18px; bottom: 16px; z-index: 5;
      font: 600 13px/1.3 system-ui, sans-serif; letter-spacing: .08em;
      color: #fff; pointer-events: none; opacity: 0;
      text-shadow: 0 1px 8px rgba(0,0,0,.45);
      transition: opacity .25s;
    }
    #status.on { opacity: 1; }
    #loading {
      position: absolute; inset: 0; display: grid; place-items: center;
      color: #f4f7fb; font: 500 13px/1.4 system-ui, sans-serif; letter-spacing: .12em;
      background: rgba(18,28,38,.28); z-index: 20; pointer-events: none;
    }
    html.thumb .from-wrap,
    html.thumb #hint, html.thumb #status, html.thumb #reset,
    html.thumb #cities, html.thumb #loading, html.thumb #credits { display: none; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <canvas id="view"></canvas>
  <div class="from-wrap">
    <a href="https://github.com/akella/threejs.paris" target="_blank" rel="noopener" class="from-link">FROM</a>
  </div>
  <div id="cities">
    <button type="button" data-city="seoul" aria-pressed="true">서울 · 롯데타워</button>
    <button type="button" data-city="nyc">뉴욕 · 여신상</button>
    <button type="button" data-city="london">런던 · 빅벤</button>
  </div>
  <button id="reset" type="button">RESET</button>
  <div id="hint">랜드마크를 당겨 구부린 뒤 놓으면 도시 밖으로 날아갑니다 · 확대하면 주변 거리가 보입니다</div>
  <div id="credits">OpenStreetMap · OpenFreeMap · Esri World Imagery</div>
  <div id="status">지도 밖</div>
  <div id="loading">LOADING CITY</div>
  <script type="module" src="./map.js"></script>
</body>
</html>
